name: Publish signed CarPaly OTA feeds
run-name: >-
  ${{ inputs.publish_production_ota == true && format('CarPaly OTA feed publish ({0})', inputs.release_tag) || 'CarPaly OTA feed publish (disabled)' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published CarPaly Release tag to validate on main
        required: true
        type: string
      publish_production_ota:
        description: Explicitly authorize the production signing and Pages deployment job
        required: true
        type: boolean
        default: false
      allow_initial_static_bootstrap:
        description: Confirm the target Pages site has never been deployed and no OTA feeds exist
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: carpaly-pages
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate production OTA readiness and real Release without secrets
    if: >-
      github.repository == 'Qwy20040320/carpaly' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_production_ota == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ota.txt
      - name: Install pinned OTA tooling
        run: python -m pip install --disable-pip-version-check -r requirements-ota.txt
      - name: Require reviewed production policy and app-pinned trust root
        run: python scripts/ota_publisher_policy.py
      - name: Build site and preserve currently deployed signed feeds
        env:
          ALLOW_INITIAL_STATIC_BOOTSTRAP: ${{ inputs.allow_initial_static_bootstrap }}
        run: |
          args=(
            --snapshot-out "$RUNNER_TEMP/carpaly-release-snapshot.json"
            --preserve-existing-ota-feeds
            --output-dir "$RUNNER_TEMP/carpaly-site"
          )
          if [[ "$ALLOW_INITIAL_STATIC_BOOTSTRAP" == "true" ]]; then
            args+=(--allow-initial-static-bootstrap)
          fi
          python scripts/build_site.py "${args[@]}"
      - name: Validate the requested published APK Release and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python scripts/validate_ota_release_target.py
          --release-snapshot "$RUNNER_TEMP/carpaly-release-snapshot.json"
          --release-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7
        with:
          name: ota-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/carpaly-site
            ${{ runner.temp }}/carpaly-release-snapshot.json
          if-no-files-found: error
          retention-days: 1

  sign_and_stage:
    name: Sign verified OTA feeds and stage Pages artifact
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      github.repository == 'Qwy20040320/carpaly' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_production_ota == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ota-manifest-publisher
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ota.txt
      - name: Install pinned OTA tooling
        run: python -m pip install --disable-pip-version-check -r requirements-ota.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact v7
        with:
          name: ota-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/carpaly-ota-input
      - name: Sign and self-verify Stable and Beta manifests
        env:
          OTA_MANIFEST_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.OTA_MANIFEST_SIGNING_PRIVATE_KEY_PEM }}
          OTA_MANIFEST_SIGNING_KEY_ID: ${{ vars.OTA_MANIFEST_SIGNING_KEY_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python scripts/build_ota_manifests.py
          --release-snapshot "$RUNNER_TEMP/carpaly-ota-input/carpaly-release-snapshot.json"
          --required-release-tag "$RELEASE_TAG"
          --output "$RUNNER_TEMP/carpaly-ota-signed-feeds"
      - name: Rebuild final site from the exact preflight snapshot and signed feeds
        env:
          ALLOW_INITIAL_STATIC_BOOTSTRAP: ${{ inputs.allow_initial_static_bootstrap }}
        run: |
          args=(
            --release-snapshot "$RUNNER_TEMP/carpaly-ota-input/carpaly-release-snapshot.json"
            --prior-site-state "$RUNNER_TEMP/carpaly-ota-input/carpaly-site/data/releases.json"
            --local-ota-feed-dir "$RUNNER_TEMP/carpaly-ota-signed-feeds"
            --output-dir "$RUNNER_TEMP/carpaly-ota-final-site"
          )
          if [[ "$ALLOW_INITIAL_STATIC_BOOTSTRAP" == "true" ]]; then
            args+=(--allow-initial-static-bootstrap)
          fi
          python scripts/build_site.py "${args[@]}"
      - name: Run OTA signing, trust, site, and preservation regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -m unittest scripts.test_ota_manifest scripts.test_build_site
          scripts.test_ota_public_key scripts.test_preserve_ota_feeds
          scripts.test_ota_publisher_policy
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # actions/upload-pages-artifact v3
        with:
          path: ${{ runner.temp }}/carpaly-ota-final-site

  deploy:
    name: Deploy atomically to GitHub Pages
    needs: sign_and_stage
    if: needs.sign_and_stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages v4
        id: deployment
