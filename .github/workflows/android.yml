name: Android checks
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v1.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go v7
        with:
          go-version: '1.25.x'
      - name: Scan complete Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          "$(go env GOPATH)/bin/gitleaks" git --redact .
      - name: Validate release publisher syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/carpaly-python-cache
        run: |
          bash -n .github/scripts/publish-authenticated-apk-release.sh
          python3 -m py_compile scripts/package_source_archive.py
          python3 scripts/check_workflow_action_pins.py
          python3 scripts/test_release_pipeline.py
      - name: Validate clean source archive packaging
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/carpaly-source-validation.zip"
          python3 scripts/package_source_archive.py --ref "$GITHUB_SHA" --output "$archive"
          python3 - "$archive" <<'PY'
          from pathlib import PurePosixPath
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as source:
              names = set(source.namelist())
              assert "CarPaly/LICENSE" in names
              assert "CarPaly/README.md" in names
              assert "CarPaly/docs/licenses/DiAuto-AGPL-3.0.txt" in names
              assert "CarPaly/shared/src/main/jni/speexdsp/COPYING" in names
              assert all(name.lower().endswith(".md") is False or name == "CarPaly/README.md" for name in names)
              blocked = {".apk", ".aab", ".pk8", ".p7b", ".pem", ".key", ".p12", ".pfx", ".jks", ".keystore"}
              assert all(PurePosixPath(name).suffix.lower() not in blocked for name in names)
              assert all(((info.external_attr >> 16) & 0o170000) != 0o120000 for info in source.infolist())
              assert source.testzip() is None
          PY
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # android-actions/setup-android v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # gradle/actions setup-gradle v6
        with:
          cache-provider: basic
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
      - name: Verify APK signatures and Android package metadata
        if: success()
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          : > apk-metadata.txt
          mapfile -d '' apks < <(find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$build_tools/apksigner" verify --verbose "$apk"
            echo "APK: $apk" | tee -a apk-metadata.txt
            "$build_tools/aapt" dump badging "$apk" | sed -n '1,2p' | tee -a apk-metadata.txt
          done
      - name: Reject authentication credentials from public Actions artifacts
        if: success()
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            entries="$(unzip -Z1 "$apk")"
            if grep -E '(^|/)(identity\.pk8|certificate\.p7b|[^/]+\.(key|pk8|p7b|pem|p12|pfx|jks|keystore))$' <<<"$entries"; then
              echo "Refusing to upload authentication material in a public Actions artifact: $apk" >&2
              exit 1
            fi
          done
      - name: Calculate debug APK SHA-256
        if: success()
        run: |
          find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z | xargs -0 -r sha256sum | tee apk-sha256.txt
          test -s apk-sha256.txt
      - name: Debug APKs and checksums
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7
        with:
          name: debug-apks-and-sha256
          path: |
            mobile/build/outputs/apk/debug/*.apk
            samples/home/build/outputs/apk/debug/*.apk
            samples/maphost/build/outputs/apk/debug/*.apk
            apk-sha256.txt
            apk-metadata.txt
  authenticated_release:
    name: Build and publish Release-signed authenticated CarPaly preview
    needs: check
    if: startsWith(github.ref, 'refs/tags/v1.')
    runs-on: ubuntu-latest
    # This environment scopes the existing release secrets/tag policy; it does not require an approval reviewer.
    environment: mfi-public-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Creating a v1.x.y tag is the maintainer's public-release action; verify distribution rights before tagging.
      - name: Confirm release tag is contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$release_commit" "$main_commit" || {
            echo "Release tag does not point to a commit contained in main." >&2
            exit 1
          }
      - name: Set up Java and Android SDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # android-actions/setup-android v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # gradle/actions setup-gradle v6
        with:
          cache-disabled: true
      - name: Provision protected MFi inputs and formal Release signer
        env:
          MFI_IDENTITY_PK8_BASE64: ${{ secrets.MFI_IDENTITY_PK8_BASE64 }}
          MFI_CERTIFICATE_P7B_BASE64: ${{ secrets.MFI_CERTIFICATE_P7B_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_SIGNING_CERT_SHA256: ${{ vars.RELEASE_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${MFI_IDENTITY_PK8_BASE64:?MFI_IDENTITY_PK8_BASE64 is not configured}"
          : "${MFI_CERTIFICATE_P7B_BASE64:?MFI_CERTIFICATE_P7B_BASE64 is not configured}"
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 is not configured}"
          : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD is not configured}"
          : "${RELEASE_KEY_ALIAS:?RELEASE_KEY_ALIAS is not configured}"
          : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD is not configured}"
          [[ "$RELEASE_SIGNING_CERT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || {
            echo "RELEASE_SIGNING_CERT_SHA256 must be a 64-digit SHA-256 fingerprint." >&2
            exit 1
          }
          auth_dir="$RUNNER_TEMP/carpaly-auth-assets"
          signing_dir="$RUNNER_TEMP/carpaly-signing"
          mkdir -p "$auth_dir/offline-mfi" "$signing_dir"
          printf '%s' "$MFI_IDENTITY_PK8_BASE64" | base64 --decode > "$auth_dir/offline-mfi/identity.pk8"
          printf '%s' "$MFI_CERTIFICATE_P7B_BASE64" | base64 --decode > "$auth_dir/offline-mfi/certificate.p7b"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/carpaly-release.p12"
          chmod 600 "$auth_dir/offline-mfi/identity.pk8" "$auth_dir/offline-mfi/certificate.p7b" "$signing_dir/carpaly-release.p12"
          test -s "$auth_dir/offline-mfi/identity.pk8"
          test -s "$auth_dir/offline-mfi/certificate.p7b"
          test -s "$signing_dir/carpaly-release.p12"
          keytool -list -v -alias "$RELEASE_KEY_ALIAS" -keystore "$signing_dir/carpaly-release.p12" \
            -storetype PKCS12 -storepass:env RELEASE_STORE_PASSWORD > "$RUNNER_TEMP/release-keystore-inspection.txt"
          signer_sha="$(awk -F': ' '/^SHA256: / { gsub(":", "", $2); print tolower($2); exit }' "$RUNNER_TEMP/release-keystore-inspection.txt")"
          [[ "$signer_sha" == "${RELEASE_SIGNING_CERT_SHA256,,}" ]] || {
            echo "Release keystore signer differs from the pinned environment certificate." >&2
            exit 1
          }
      - name: Build authenticated standalone Release APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/carpaly-auth-assets
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/carpaly-signing/carpaly-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :mobile:lintRelease :mobile:verifyStandaloneAuthentication :mobile:assembleRelease --stacktrace
      - name: Verify APK metadata, signer, auth hashes and release name
        id: apk
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/carpaly-auth-assets
          RELEASE_SIGNING_CERT_SHA256: ${{ vars.RELEASE_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile/build/outputs/apk/release/mobile-release.apk"
          test -s "$apk"
          unzip -tq "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          signer_sha="$("$build_tools/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print tolower($2); exit }')"
          expected_signer_sha="${RELEASE_SIGNING_CERT_SHA256,,}"
          [[ "$signer_sha" == "$expected_signer_sha" ]] || {
            echo "APK signer differs from the pinned Release certificate." >&2
            exit 1
          }
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -Fq "package: name='com.shihab.diplay.hudtest'" <<<"$badging"
          expected_version="${GITHUB_REF_NAME#v}"
          grep -Fq "versionName='$expected_version'" <<<"$badging"
          version_code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<<"$badging" | head -n 1)"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          if [[ "$expected_version" == "1.1.4" && "$version_code" != "36" ]]; then
            echo "CarPaly v1.1.4 must retain Android versionCode 36." >&2
            exit 1
          fi
          auth_dir="$DIPLAY_AUTH_ASSETS_DIR/offline-mfi"
          for name in identity.pk8 certificate.p7b; do
            source_sha="$(sha256sum "$auth_dir/$name" | awk '{ print $1 }')"
            apk_sha="$(unzip -p "$apk" "assets/offline-mfi/$name" | sha256sum | awk '{ print $1 }')"
            [[ -n "$source_sha" && "$source_sha" == "$apk_sha" ]] || {
              echo "Authenticated APK asset mismatch: $name" >&2
              exit 1
            }
          done
          actual_sha="$(sha256sum "$apk" | awk '{ print $1 }')"
          size="$(stat -c '%s' "$apk")"
          if (( size > 50 * 1024 * 1024 )); then
            echo "APK is larger than the 50 MiB release ceiling ($size bytes)." >&2
            exit 1
          fi
          if (( size > 30 * 1024 * 1024 )); then
            echo "::warning::APK exceeds the 30 MiB target ($size bytes)."
          fi
          release_dir="$RUNNER_TEMP/carpaly-release"
          mkdir -p "$release_dir"
          release_name="CarPaly-XingyueL${expected_version}.apk"
          release_apk="$release_dir/$release_name"
          cp "$apk" "$release_apk"
          test "$(sha256sum "$release_apk" | awk '{ print $1 }')" = "$actual_sha"
          echo "apk_path=$release_apk" >> "$GITHUB_OUTPUT"
          echo "apk_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Package commit-pinned source and release checksums
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/carpaly-release"
          source_name="${APK_NAME%.apk}-source.zip"
          source_path="$release_dir/$source_name"
          python3 scripts/package_source_archive.py --ref "$RELEASE_TAG" --output "$source_path"
          source_sha="$(sha256sum "$source_path" | awk '{ print $1 }')"
          source_size="$(stat -c '%s' "$source_path")"
          sums_path="$release_dir/SHA256SUMS.txt"
          (
            cd "$release_dir"
            sha256sum "$APK_NAME" "$source_name" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          sums_sha="$(sha256sum "$sums_path" | awk '{ print $1 }')"
          sums_size="$(stat -c '%s' "$sums_path")"
          printf 'Source ZIP: %s (%s bytes, SHA-256 %s)\n' "$source_name" "$source_size" "$source_sha"
          printf 'SHA256SUMS.txt: %s bytes, SHA-256 %s\n' "$sums_size" "$sums_sha"
          echo "source_path=$source_path" >> "$GITHUB_OUTPUT"
          echo "source_name=$source_name" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_size=$source_size" >> "$GITHUB_OUTPUT"
          echo "sums_path=$sums_path" >> "$GITHUB_OUTPUT"
          echo "sums_sha256=$sums_sha" >> "$GITHUB_OUTPUT"
          echo "sums_size=$sums_size" >> "$GITHUB_OUTPUT"
      - name: Publish and verify authenticated pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          SOURCE_ZIP_PATH: ${{ steps.package.outputs.source_path }}
          SOURCE_ZIP_NAME: ${{ steps.package.outputs.source_name }}
          SOURCE_ZIP_SHA256: ${{ steps.package.outputs.source_sha256 }}
          SOURCE_ZIP_SIZE: ${{ steps.package.outputs.source_size }}
          SHA256SUMS_PATH: ${{ steps.package.outputs.sums_path }}
          SHA256SUMS_SHA256: ${{ steps.package.outputs.sums_sha256 }}
          SHA256SUMS_SIZE: ${{ steps.package.outputs.sums_size }}
        run: bash .github/scripts/publish-authenticated-apk-release.sh
      - name: Remove local release credentials from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/carpaly-auth-assets" "$RUNNER_TEMP/carpaly-release" \
            "$RUNNER_TEMP/carpaly-release-remote" "$RUNNER_TEMP/carpaly-release-published" \
            "$RUNNER_TEMP/carpaly-signing" "$RUNNER_TEMP/carpaly-python-cache" \
            "$RUNNER_TEMP/release-keystore-inspection.txt"
