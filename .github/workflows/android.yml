name: Android checks
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v1.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Scan complete Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          "$(go env GOPATH)/bin/gitleaks" git --redact .
      - name: Validate release publisher syntax
        run: bash -n .github/scripts/publish-authenticated-apk-release.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
      - name: Verify APK signatures and Android package metadata
        if: success()
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          : > apk-metadata.txt
          mapfile -d '' apks < <(find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$build_tools/apksigner" verify --verbose "$apk"
            echo "APK: $apk" | tee -a apk-metadata.txt
            "$build_tools/aapt" dump badging "$apk" | sed -n '1,2p' | tee -a apk-metadata.txt
          done
      - name: Reject authentication credentials from public Actions artifacts
        if: success()
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            entries="$(unzip -Z1 "$apk")"
            if grep -E '(^|/)(identity\.pk8|certificate\.p7b|[^/]+\.(key|pk8|p7b|pem|p12|pfx|jks|keystore))$' <<<"$entries"; then
              echo "Refusing to upload authentication material in a public Actions artifact: $apk" >&2
              exit 1
            fi
          done
      - name: Calculate debug APK SHA-256
        if: success()
        run: |
          find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z | xargs -0 -r sha256sum | tee apk-sha256.txt
          test -s apk-sha256.txt
      - name: Debug APKs and checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks-and-sha256
          path: |
            mobile/build/outputs/apk/debug/*.apk
            samples/home/build/outputs/apk/debug/*.apk
            samples/maphost/build/outputs/apk/debug/*.apk
            apk-sha256.txt
            apk-metadata.txt
  authenticated_release:
    name: Build and publish authenticated CarPaly preview
    needs: check
    if: startsWith(github.ref, 'refs/tags/v1.')
    runs-on: ubuntu-latest
    environment: mfi-public-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Require reviewed third-party public-distribution grant
        env:
          MFI_PUBLIC_DISTRIBUTION_REVIEWED: ${{ vars.MFI_PUBLIC_DISTRIBUTION_REVIEWED }}
          MFI_PUBLIC_DISTRIBUTION_AUTHORIZATION_REF: ${{ secrets.MFI_PUBLIC_DISTRIBUTION_AUTHORIZATION_REF }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MFI_PUBLIC_DISTRIBUTION_REVIEWED" == "true" ]] || {
            echo "Public authentication-asset release is disabled until a maintainer verifies the original-author grant." >&2
            exit 1
          }
          [[ -n "$MFI_PUBLIC_DISTRIBUTION_AUTHORIZATION_REF" ]] || {
            echo "The reviewed authorization record reference is not configured." >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == v1.*.* ]] || {
            echo "Only CarPaly v1.x.y release tags are accepted." >&2
            exit 1
          }
      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision protected MFi inputs and stable debug signer
        env:
          MFI_IDENTITY_PK8_BASE64: ${{ secrets.MFI_IDENTITY_PK8_BASE64 }}
          MFI_CERTIFICATE_P7B_BASE64: ${{ secrets.MFI_CERTIFICATE_P7B_BASE64 }}
          CARPALY_DEBUG_KEYSTORE_BASE64: ${{ secrets.CARPALY_DEBUG_KEYSTORE_BASE64 }}
          CARPALY_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CARPALY_DEBUG_KEYSTORE_PASSWORD }}
          CARPALY_DEBUG_KEY_ALIAS: ${{ secrets.CARPALY_DEBUG_KEY_ALIAS }}
          CARPALY_DEBUG_KEY_PASSWORD: ${{ secrets.CARPALY_DEBUG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${MFI_IDENTITY_PK8_BASE64:?MFI_IDENTITY_PK8_BASE64 is not configured}"
          : "${MFI_CERTIFICATE_P7B_BASE64:?MFI_CERTIFICATE_P7B_BASE64 is not configured}"
          : "${CARPALY_DEBUG_KEYSTORE_BASE64:?CARPALY_DEBUG_KEYSTORE_BASE64 is not configured}"
          : "${CARPALY_DEBUG_KEYSTORE_PASSWORD:?CARPALY_DEBUG_KEYSTORE_PASSWORD is not configured}"
          : "${CARPALY_DEBUG_KEY_ALIAS:?CARPALY_DEBUG_KEY_ALIAS is not configured}"
          : "${CARPALY_DEBUG_KEY_PASSWORD:?CARPALY_DEBUG_KEY_PASSWORD is not configured}"
          auth_dir="$RUNNER_TEMP/carpaly-auth-assets"
          signing_dir="$RUNNER_TEMP/carpaly-signing"
          mkdir -p "$auth_dir/offline-mfi" "$signing_dir"
          printf '%s' "$MFI_IDENTITY_PK8_BASE64" | base64 --decode > "$auth_dir/offline-mfi/identity.pk8"
          printf '%s' "$MFI_CERTIFICATE_P7B_BASE64" | base64 --decode > "$auth_dir/offline-mfi/certificate.p7b"
          printf '%s' "$CARPALY_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/debug.keystore"
          chmod 600 "$auth_dir/offline-mfi/identity.pk8" "$auth_dir/offline-mfi/certificate.p7b" "$signing_dir/debug.keystore"
          test -s "$auth_dir/offline-mfi/identity.pk8"
          test -s "$auth_dir/offline-mfi/certificate.p7b"
          test -s "$signing_dir/debug.keystore"
      - name: Build and verify authenticated standalone debug APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/carpaly-auth-assets
          CARPALY_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/carpaly-signing/debug.keystore
          CARPALY_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CARPALY_DEBUG_KEYSTORE_PASSWORD }}
          CARPALY_DEBUG_KEY_ALIAS: ${{ secrets.CARPALY_DEBUG_KEY_ALIAS }}
          CARPALY_DEBUG_KEY_PASSWORD: ${{ secrets.CARPALY_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :mobile:verifyStandaloneDebugApk --stacktrace
      - name: Verify APK metadata, signer, auth hashes and release name
        id: apk
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/carpaly-auth-assets
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile/build/outputs/apk/debug/mobile-debug.apk"
          test -s "$apk"
          unzip -tq "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          signer_sha="$("$build_tools/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print tolower($2); exit }')"
          expected_signer_sha="7b729b4066beec0f8321963c3c8bc68fbbe2162120845c28263e8cae157bbdc0"
          [[ "$signer_sha" == "$expected_signer_sha" ]] || {
            echo "APK signer differs from the locally delivered v1.1.4 debug signer; refusing an incompatible update." >&2
            exit 1
          }
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -Fq "package: name='com.shihab.diplay.hudtest'" <<<"$badging"
          expected_version="${GITHUB_REF_NAME#v}"
          grep -Fq "versionName='$expected_version'" <<<"$badging"
          version_code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<<"$badging" | head -n 1)"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          auth_dir="$DIPLAY_AUTH_ASSETS_DIR/offline-mfi"
          for name in identity.pk8 certificate.p7b; do
            source_sha="$(sha256sum "$auth_dir/$name" | awk '{ print $1 }')"
            apk_sha="$(unzip -p "$apk" "assets/offline-mfi/$name" | sha256sum | awk '{ print $1 }')"
            [[ -n "$source_sha" && "$source_sha" == "$apk_sha" ]] || {
              echo "Authenticated APK asset mismatch: $name" >&2
              exit 1
            }
          done
          actual_sha="$(sha256sum "$apk" | awk '{ print $1 }')"
          size="$(stat -c '%s' "$apk")"
          if (( size > 50 * 1024 * 1024 )); then
            echo "APK is larger than the 50 MiB release ceiling ($size bytes)." >&2
            exit 1
          fi
          if (( size > 30 * 1024 * 1024 )); then
            echo "::warning::APK exceeds the 30 MiB target ($size bytes)."
          fi
          release_dir="$RUNNER_TEMP/carpaly-release"
          mkdir -p "$release_dir"
          release_name="CarPaly-XingyueL${expected_version}.apk"
          release_apk="$release_dir/$release_name"
          release_checksum="$release_dir/$release_name.sha256"
          cp "$apk" "$release_apk"
          printf '%s  %s\n' "$actual_sha" "$release_name" > "$release_checksum"
          test "$(sha256sum "$release_apk" | awk '{ print $1 }')" = "$actual_sha"
          (cd "$release_dir" && sha256sum --check --status "$release_name.sha256")
          echo "apk_path=$release_apk" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$release_checksum" >> "$GITHUB_OUTPUT"
          echo "apk_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Publish and verify authenticated pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        run: bash .github/scripts/publish-authenticated-apk-release.sh
      - name: Remove local release credentials from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/carpaly-auth-assets" "$RUNNER_TEMP/carpaly-release" \
            "$RUNNER_TEMP/carpaly-release-remote" "$RUNNER_TEMP/carpaly-release-published" \
            "$RUNNER_TEMP/carpaly-signing"
