name: Android checks
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Scan complete Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          "$(go env GOPATH)/bin/gitleaks" git --redact .
      - name: Validate release publisher syntax
        run: bash -n .github/scripts/publish-apk-release.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
      - name: Verify APK signatures and Android package metadata
        if: success()
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          : > apk-metadata.txt
          mapfile -d '' apks < <(find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$build_tools/apksigner" verify --verbose "$apk"
            echo "APK: $apk" | tee -a apk-metadata.txt
            "$build_tools/aapt" dump badging "$apk" | sed -n '1,2p' | tee -a apk-metadata.txt
          done
      - name: Reject authentication credentials from public Actions artifacts
        if: success()
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            entries="$(unzip -Z1 "$apk")"
            if grep -E '(^|/)(identity\.pk8|certificate\.p7b|[^/]+\.(key|pk8|p7b|pem|p12|pfx|jks|keystore))$' <<<"$entries"; then
              echo "Refusing to upload authentication material in a public Actions artifact: $apk" >&2
              exit 1
            fi
          done
      - name: Calculate debug APK SHA-256
        if: success()
        run: |
          find mobile samples/home samples/maphost -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | sort -z | xargs -0 -r sha256sum | tee apk-sha256.txt
          test -s apk-sha256.txt
      - name: Debug APKs and checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks-and-sha256
          path: |
            mobile/build/outputs/apk/debug/*.apk
            samples/home/build/outputs/apk/debug/*.apk
            samples/maphost/build/outputs/apk/debug/*.apk
            apk-sha256.txt
            apk-metadata.txt
  release:
    name: Publish verified CarPaly APK
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: debug-apks-and-sha256
          path: dist
      - name: Require local MFi assets (source-only APKs must not publish)
        run: |
          set -euo pipefail
          apk="dist/mobile/build/outputs/apk/debug/mobile-debug.apk"
          test -s "$apk"
          entries="$(unzip -Z1 "$apk")"
          for required in assets/offline-mfi/identity.pk8 assets/offline-mfi/certificate.p7b; do
            if ! grep -Fxq "$required" <<<"$entries"; then
              echo "Refusing to publish a source-only APK; missing required local MFi asset: $required" >&2
              exit 1
            fi
          done
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - name: Verify the main app APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example v0.1.1)." >&2
            exit 1
          }
          apk="dist/mobile/build/outputs/apk/debug/mobile-debug.apk"
          test -s "$apk"
          unzip -tq "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -Fq "package: name='com.shihab.diplay.hudtest'" <<<"$badging"
          expected_version="${GITHUB_REF_NAME#v}"
          grep -Fq "versionName='$expected_version'" <<<"$badging"
          version_code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\\1/p" <<<"$badging" | head -n 1)"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          grep -Fq "package: name='com.shihab.diplay.hudtest'" dist/apk-metadata.txt
          expected_sha="$(awk '$2 == "mobile/build/outputs/apk/debug/mobile-debug.apk" { print $1 }' dist/apk-sha256.txt)"
          actual_sha="$(sha256sum "$apk" | awk '{ print $1 }')"
          test -n "$expected_sha"
          test "$expected_sha" = "$actual_sha"
          size="$(stat -c '%s' "$apk")"
          if (( size > 50 * 1024 * 1024 )); then
            echo "APK is larger than the 50 MiB release ceiling ($size bytes)." >&2
            exit 1
          fi
          if (( size > 30 * 1024 * 1024 )); then
            echo "::warning::APK exceeds the 30 MiB target ($size bytes)."
          fi
          release_dir="$RUNNER_TEMP/carpaly-release"
          mkdir -p "$release_dir"
          release_apk="$release_dir/CarPaly-XingyueL${expected_version}.apk"
          cp "$apk" "$release_apk"
          test "$(sha256sum "$release_apk" | awk '{ print $1 }')" = "$actual_sha"
          echo "path=$release_apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Create or safely update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        run: bash .github/scripts/publish-apk-release.sh
