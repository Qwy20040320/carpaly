name: Publish CarPaly download site and signed OTA feeds
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_id != '' && format('CarPaly Pages deploy ({0})', inputs.dispatch_id) || format('CarPaly Pages deploy ({0})', github.sha) }}

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/ota_manifest.py'
      - 'scripts/build_ota_manifests.py'
      - 'scripts/export_ota_public_key.py'
      - 'scripts/sync_release_docs.py'
      - 'config/ota-policy.json'
      - 'config/android-version-ledger.json'
      - 'config/release-documentation.json'
      - 'common/src/main/res/raw/ota_manifest_public_keys.json'
      - 'requirements-ota.txt'
      - '.github/workflows/pages.yml'
      - 'scripts/test_ota_public_key.py'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Correlation ID for a release follow-up dispatch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: carpaly-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ota-manifest-publisher
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ota.txt
      - name: Install pinned OTA tooling
        run: python -m pip install --disable-pip-version-check -r requirements-ota.txt
      - name: Build public site from published verified Releases
        run: python scripts/build_site.py --snapshot-out "$RUNNER_TEMP/carpaly-release-snapshot.json"
      - name: Build signed Stable and Beta OTA manifests
        env:
          OTA_MANIFEST_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.OTA_MANIFEST_SIGNING_PRIVATE_KEY_PEM }}
          OTA_MANIFEST_SIGNING_KEY_ID: ${{ vars.OTA_MANIFEST_SIGNING_KEY_ID }}
        run: >-
          python scripts/build_ota_manifests.py
          --release-snapshot "$RUNNER_TEMP/carpaly-release-snapshot.json"
          --output site/updates
      - name: Run offline site and signing regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest scripts.test_ota_manifest scripts.test_build_site scripts.test_ota_public_key
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # actions/upload-pages-artifact v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages v4
        id: deployment
